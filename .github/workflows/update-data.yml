name: Update LCFC Data

on:
  schedule:
    # 毎時15分に自動実行（UTC基準）
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data update script
        run: node scripts/update-lcfc.mjs

      - name: Commit and push updated data/lcfc.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lcfc.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update data/lcfc.json"
            git push
          fi
